[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dltree-downloader"
version = "0.1.0"
description = "Local CLI for importing and downloading DL tree records."
requires-python = ">=3.11"
dependencies = [
    "openpyxl",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
dltree = "dltree.cli:main"

[tool.setuptools.packages.find]
include = ["dltree*"]

[tool.setuptools.package-data]
dltree = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
